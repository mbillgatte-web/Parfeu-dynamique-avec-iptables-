databases:
  - name: parfeu-dynamique-db
    plan: free

services:
  - type: web
    name: parfeu-dynamique
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn Projet_Parfeu.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: parfeu-dynamique-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
